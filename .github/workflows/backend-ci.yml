name: backend-ci

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillmkt
          POSTGRES_PASSWORD: skillmkt
          POSTGRES_DB: skillmkt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillmkt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SESSION_SECRET: ci-session-secret-ci-session-secret-0123456789
      DATABASE_URL: postgresql+psycopg://skillmkt:skillmkt@localhost:5432/skillmkt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migration trên database trống, rồi kiểm tra không lệch model
        run: |
          alembic upgrade head
          alembic check

      - name: Test (PostgreSQL thật)
        env:
          # Database riêng: test xoá và tạo lại bảng, không đụng database vừa migrate ở trên.
          TEST_DATABASE_URL: postgresql+psycopg://skillmkt:skillmkt@localhost:5432/skilltest
        run: |
          PGPASSWORD=skillmkt psql -h localhost -U skillmkt -d skillmkt -c "CREATE DATABASE skilltest"
          pytest -q

  azurite:
    # Test tích hợp Azure Blob với trình giả lập; tách job để job chính không phụ thuộc Node/Azurite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SESSION_SECRET: ci-session-secret-ci-session-secret-0123456789
      AZURITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy Azurite
        run: |
          npx --yes azurite --silent --blobPort 10000 --skipApiVersionCheck &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1 && break; sleep 1; done
      - run: pytest -q tests/test_storage_azure.py

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t skillmkt-backend:ci backend
