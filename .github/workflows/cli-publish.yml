name: cli-publish

# Phát hành CLI lên kho npm nội bộ khi gắn tag cli-vX.Y.Z (D29). Chỉ từ nhánh main.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chỉ phát hành tag nằm trên nhánh main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag ${GITHUB_REF_NAME} không nằm trên main; từ chối phát hành."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
          # NPM_REGISTRY_URL (biến Actions), ví dụ https://pkgs.dev.azure.com/<org>/_packaging/<feed>/npm/registry/
          registry-url: ${{ vars.NPM_REGISTRY_URL }}
          scope: "@company"

      - name: Số phiên bản trong tag phải khớp package.json
        run: |
          expected="${GITHUB_REF_NAME#cli-v}"
          actual="$(node -p "require('./package.json').version")"
          [ "$expected" = "$actual" ] || { echo "Tag $expected khác package.json $actual"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish lên kho nội bộ
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
