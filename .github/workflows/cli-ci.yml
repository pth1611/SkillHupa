name: cli-ci

on:
  pull_request:
    paths: ["cli/**", ".github/workflows/cli-ci.yml"]
  push:
    branches: [main]
    paths: ["cli/**", ".github/workflows/cli-ci.yml"]

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Chạy trên cả ba hệ điều hành vì đường dẫn và thư mục cài khác nhau (pipeline.md, CI cho CLI).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Đóng gói thử
        run: npm pack --dry-run
